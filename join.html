<style>
/* Layout: one-column phone app, a navy staff bar on top and one task card per screen; big thumb-sized buttons at the bottom */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#14213a; --sub:#5d6475; --line:#dcd8cf;
  --gold:#b0873a; --gold-soft:#f4ead6; --ok:#2f7d4f; --ok-soft:#e3f2e8; --warn:#a0471f;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141d; --surface:#1a202c; --ink:#eef0f4; --sub:#a3aab8; --line:#2d3546;
  --gold:#d6ab5c; --gold-soft:#3a3020; --ok:#62c18a; --ok-soft:#1d3428; --warn:#e48a62;
  --bar:#0b0f17; --bar-fg:#eef0f4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141d; --surface:#1a202c; --ink:#eef0f4; --sub:#a3aab8; --line:#2d3546;
  --gold:#d6ab5c; --gold-soft:#3a3020; --ok:#62c18a; --ok-soft:#1d3428; --warn:#e48a62;
  --bar:#0b0f17; --bar-fg:#eef0f4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;letter-spacing:.02em;font-size:15px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.75;letter-spacing:0}
.chip-btn{background:transparent;border:1px solid color-mix(in srgb,var(--bar-fg) 35%,transparent);color:var(--bar-fg);
  border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:480px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0}
p{margin:0}
.muted{color:var(--sub);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:14px;padding:18px;font:inherit;cursor:pointer}
.big .ic{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.big b{display:block;font-size:17px}
.big span{color:var(--sub);font-size:14px}
.big.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.big.primary span{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.big.primary .ic{background:var(--gold);color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;background:var(--ink);color:var(--bg);text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#1b1408}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.big:focus-visible,input:focus-visible,.seg button:focus-visible,.staff button:focus-visible,.chip-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600}
input[type=text],input[type=tel]{width:100%;font:inherit;font-size:18px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}

.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.agree input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--gold)}
.agree em{font-style:normal;font-weight:700;color:var(--gold)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--gold)}
.gift{border-radius:14px;padding:18px;background:var(--gold-soft);display:flex;gap:14px;align-items:center}
.gift .cup{flex:none;width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--gold)}
.gift b{display:block;font-size:17px}
.code{font-size:34px;letter-spacing:.35em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.demo{font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:8px;padding:8px 10px}

.qrbox img,.qrbox canvas{width:min(70vw,260px)!important;height:auto!important}
.url{font-size:12px;color:var(--sub);word-break:break-all;text-align:center}
.list{display:grid;gap:0}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0}
.row .t{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.pill{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--ok-soft);color:var(--ok);font-weight:600;white-space:nowrap}
.pill.ex{background:var(--line);color:var(--sub)}
.staff{display:grid;gap:8px}
.staff button{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:14px;font:inherit;text-align:left;cursor:pointer}
.staff button span{color:var(--sub);font-size:13px;text-align:right}
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto}
.center{text-align:center}
.testband{background:#a0471f;color:#fff;text-align:center;font-size:14px;font-weight:600;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

<style>

.card{position:relative}
.no{position:absolute;top:-12px;left:16px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700}
.sns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

<style>
.hero{position:relative;overflow:hidden;background:var(--bar);color:var(--bar-fg);border-radius:20px;padding:22px 20px 20px}
.hero-k{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--gold);background:rgba(255,255,255,.08);border-radius:999px;padding:4px 10px}
.hero h1{color:var(--bar-fg);font-size:28px;line-height:1.25;margin:10px 0 6px}
.hero p{margin:0;font-size:15px;opacity:.8}
.hero-cup{position:absolute;right:-6px;top:10px;opacity:.16;transform:scale(3.4);transform-origin:top right;color:var(--gold)}
.pg{display:flex;align-items:center;gap:10px;margin-top:16px}
.pg-bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.pg-bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .35s}
.pg b{font-size:15px;min-width:42px;text-align:right}
.tasks{display:grid;gap:10px}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;transition:border-color .2s,background .2s}
.task .ti{position:relative;flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.task .ti.kakao{background:#FEE500;color:#191919}
.task .ti.insta{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);color:#fff}
.task .ti.ink{background:var(--ink);color:var(--bg)}
.task .tk{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--sub)}
.task.on{border-color:var(--ok);background:var(--ok-soft)}
.task.on .tk{background:var(--ok);border-color:var(--ok);color:#fff}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:16px}
.task .tx span{display:block;font-size:13px;color:var(--sub);line-height:1.4;margin-top:2px}
.task .tb{display:flex;flex-direction:column;gap:6px;flex:none}
.tbtn{display:block;text-align:center;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.tbtn.kakao{background:#FEE500;color:#191919}
.tbtn.insta{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);color:#fff}
.tbtn.ink{background:var(--ink);color:var(--bg)}
.task.on .tbtn{background:transparent;color:var(--ok);border:1.5px solid var(--ok);padding:8.5px 12.5px}
.cpn{border:2px solid var(--gold);transition:opacity .2s}
.cpn-h{display:flex;gap:12px;align-items:center;color:var(--gold)}
.cpn-h .lk{flex:none;width:44px;height:44px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;font-size:20px}
.cpn-h b{display:block;font-size:18px;color:var(--ink)}
.cpn-body{display:grid;gap:12px;margin-top:14px}
.cpn.lock{border:1.5px dashed var(--line);opacity:.75}
.cpn.lock .cpn-body{display:none}
.err.ok{color:var(--ok)}
</style>
</head>

   function(){

     document.getElementById('goLink').onclick=function(){
       var b=this,url=JOIN_URL+'?s='+(st.staff+1)+'&from=link',s=STAFF[st.staff];
       var txt='사장님, 세왕상사 '+s[0]+' '+s[1]+'입니다. 아래 링크에서 카카오 채널 추가·인스타 팔로우·주문 앱 받기를 해 주시면 메가MGC커피 아메리카노 쿠폰 2장(각 1잔·유효기간 30일)을 보내 드립니다(1분).';
       ev('join_link_send');
       if(navigator.share){navigator.share({title:'세왕상사 거래처 가입',text:txt,url:url}).catch(function(){});return;}
       var all=txt+'\n'+url,done=function(){b.querySelector('b').textContent='복사했습니다 — 카톡에 붙여 넣으세요';setTimeout(function(){b.querySelector('b').textContent='링크 보내기';},2500);};
       if(navigator.clipboard){navigator.clipboard.writeText(all).then(done,function(){prompt('복사해서 보내세요',all);});}else{prompt('복사해서 보내세요',all);}
     };
     call({action:'join_stats',staff:st.staff}).then(function(d){
       var c=document.getElementById('cnt'),m=document.getElementById('mine');if(!c)return;
       if(!d||!d.ok){c.textContent='';m.innerHTML='<div class="row"><div class="t">기록을 불러오지 못했습니다.</div></div>';return;}
       c.textContent='오늘 '+d.today+'건 · 전체 '+d.total+'건';
       m.innerHTML=d.recent.length?d.recent.map(function(r){var pill=r.coupon==='발송'?'<span class="pill">쿠폰 발송</span>':'<span class="pill wait">쿠폰 '+esc(r.coupon||'대기')+'</span>';
         return '<div class="row"><div><b>'+esc(r.store)+'</b><div class="t">'+(r.type?esc(r.type)+' · ':'')+esc(r.phone)+'</div></div><div style="text-align:right">'+pill+'<div class="t">'+esc(r.time)+'</div></div></div>';}).join('')
         :'<div class="row"><div class="t">아직 가입이 없습니다. 첫 업주님을 가입시켜 보세요.</div></div>';
     });
   });
}

/* 3. QR */
function qr(){
  var url=JOIN_URL+'?s='+(st.staff+1);ev('join_qr');
  show('<h1>이 화면을<br>업주님께 보여 주세요</h1><p class="muted">업주님이 자기 폰 카메라로 찍으면 가입 화면이 열립니다.</p><div class="qrbox"><div id="qr"></div></div><p class="url">'+esc(url)+'</p>'+
   '<div class="gift"><span class="cup">'+ICON.cup+'</span><div><b>가입하면 메가MGC커피 아메리카노 2잔</b><span class="muted">각 1잔 쿠폰 2장 · 문자 발송 · 유효기간 30일</span></div></div>'+
   '<button class="btn ghost" id="back" type="button">처음으로</button>',
   function(){
     try{new QRCode(document.getElementById('qr'),{text:url,width:520,height:520,colorDark:'#14213a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}
     catch(e){document.getElementById('qr').textContent='QR을 그리지 못했습니다. 위 주소를 업주님께 보내 주세요.';}
     document.getElementById('back').onclick=home;});
}

/* 4. 업주 화면 — 할 일 3개(카카오·인스타·주문앱) → 쿠폰 받기(매장·번호·인증) */
function resetForm(){st.form={store:"",phone:"",must:false,opt:false};st.done={kakao:false,insta:false,app:false};st.sent=false;}
function allDone(){return st.done.kakao&&st.done.insta&&st.done.app;}
function step1(){
  var f=st.form,d=st.done;ev('join_form');
  var appLinks=OS==='ios'?[[APP_IOS,'앱 받기']]:OS==='and'?[[APP_AND,'앱 받기']]:[[APP_IOS,'아이폰'],[APP_AND,'안드로이드']];
  var IG='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>';
  var TI={kakao:ICON.talk,insta:IG,app:ICON.bag};
  function task(k,n,title,sub,btns,cls){
    return '<div class="task'+(d[k]?' on':'')+'" data-k="'+k+'"><div class="ti '+cls+'">'+TI[k]+'<span class="tk">'+(d[k]?'✓':n)+'</span></div><div class="tx"><b>'+title+'</b><span>'+sub+'</span></div><div class="tb">'+
      btns.map(function(b){return '<a class="tbtn '+cls+'" href="'+b[0]+'" target="_blank" rel="noopener" data-k="'+k+'">'+b[1]+'</a>';}).join('')+'</div></div>';
  }
  function cnt(){return (d.kakao?1:0)+(d.insta?1:0)+(d.app?1:0);}
  show('<section class="hero"><div class="hero-k">세왕상사 거래처 가입</div><h1>메가MGC커피<br>아메리카노 2잔</h1><p>카카오 채널 · 인스타 · 주문 앱. 1분이면 끝나요.</p>'+
     '<div class="pg"><div class="pg-bar"><i id="pgFill" style="width:'+(cnt()*100/3)+'%"></i></div><b id="pgTxt">'+cnt()+' / 3</b></div><span class="hero-cup">'+ICON.cup+'</span></section>'+
   '<section class="tasks">'+
     task('kakao','1','카카오톡 채널 추가','매주 수요일 시장 리포트를 카톡으로',[[CHANNEL,'추가']],'kakao')+
     task('insta','2','인스타그램 팔로우','신상품·행사 소식 @sewangliquor',[[INSTA,'팔로우']],'insta')+
     task('app','3','주문 앱 받기','세왕상사 주류주문 · 전화 없이 주문',appLinks,'ink')+
   '</section>'+
   '<form class="card cpn'+(allDone()?'':' lock')+'" id="f1" novalidate>'+
     '<div class="cpn-h"><span class="lk">'+(allDone()?ICON.cup:'🔒')+'</span><div><b>아메리카노 쿠폰 2장 받기</b><span class="muted" id="lockMsg">'+(allDone()?'매장 이름과 번호를 넣으면 문자로 보내 드려요':'위 3개를 마치면 열려요')+'</span></div></div>'+
     '<div class="cpn-body">'+
     '<label class="f" for="store">매장 이름<input id="store" type="text" autocomplete="organization" placeholder="예: 세왕 비스트로 성수점" value="'+esc(f.store)+'"></label>'+
     '<label class="f" for="phone">휴대폰 번호<input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" value="'+esc(f.phone)+'"></label>'+
     '<label class="agree warnbox" for="must"><input id="must" type="checkbox"'+(f.must?' checked':'')+'><span><em>[필수]</em> 쿠폰 발송을 위해 매장명·휴대폰 번호 수집에 동의하며, <b>쿠폰 유효기간은 30일이며, 유효기간이 지나면 연장·환불·재발송이 안 되는 것</b>을 확인했습니다.</span></label>'+
     '<div id="codeWrap" hidden><label class="f" for="code">문자로 온 인증번호 4자리<input id="code" class="code" type="tel" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="····"></label></div>'+
     '<p class="err" id="e1" hidden></p>'+
     '<button class="btn gold" type="submit" id="goBtn">'+(MANUAL?'가입하고 쿠폰 신청':'인증번호 받기')+'</button>'+
   '</div></form>'+
   (OWNER?'':'<button class="btn ghost" id="cancel" type="button">직원 화면으로</button>'),
   function(){
     var form=document.getElementById('f1'),er=document.getElementById('e1'),btn=document.getElementById('goBtn'),cw=document.getElementById('codeWrap');
     function refresh(){
       app.querySelectorAll('.task').forEach(function(t){var k=t.dataset.k;t.classList.toggle('on',d[k]);t.querySelector('.tk').textContent=d[k]?'✓':({kakao:'1',insta:'2',app:'3'})[k];});
       var was=form.classList.contains('lock');
       form.classList.toggle('lock',!allDone());
       document.getElementById('pgFill').style.width=(cnt()*100/3)+'%';document.getElementById('pgTxt').textContent=cnt()+' / 3';
       document.getElementById('lockMsg').textContent=allDone()?'매장 이름과 번호를 넣으면 문자로 보내 드려요':'위 3개를 마치면 열려요';
       form.querySelector('.lk').innerHTML=allDone()?ICON.cup:'🔒';
       if(was&&allDone()){setTimeout(function(){form.scrollIntoView({behavior:'smooth',block:'start'});},350);}
     }
     app.querySelectorAll('.tbtn').forEach(function(a){a.addEventListener('click',function(){d[a.dataset.k]=true;ev('join_task',{task:a.dataset.k});setTimeout(refresh,300);});});
     var ph=document.getElementById('phone');ph.addEventListener('input',function(){ph.value=dash(ph.value);});
     var cb=document.getElementById('cancel');if(cb)cb.onclick=home;
     if(st.sent){cw.hidden=false;btn.textContent='확인하고 쿠폰 받기';}
     form.addEventListener('submit',function(e){
       e.preventDefault();er.hidden=true;
       if(!allDone()){er.textContent='위 3개(카카오·인스타·앱)를 먼저 눌러 주세요.';er.hidden=false;return;}
       f.store=document.getElementById('store').value.trim();f.phone=dash(ph.value);f.must=document.getElementById('must').checked;
       var msg='';
       if(!f.store)msg='매장 이름을 입력해 주세요.';
       else if(!/^01[016789]-\d{3,4}-\d{4}$/.test(f.phone))msg='휴대폰 번호를 다시 확인해 주세요. (예: 010-1234-5678)';
       else if(!f.must)msg='[필수] 항목에 체크해 주세요.';
       if(msg){er.textContent=msg;er.hidden=false;return;}
       if(MANUAL){verify('');return;}
       if(!st.sent){
         busy(btn,true,'인증번호 보내는 중…');
         call({action:'join_send',phone:f.phone,staff:st.staff,store:f.store}).then(function(r){
           busy(btn,false);
           if(r&&r.ok){st.sent=true;ev('join_sms_sent');cw.hidden=false;btn.textContent='확인하고 쿠폰 받기';document.getElementById('code').focus();
             er.textContent=f.phone+'로 인증번호를 보냈습니다. (5분 안에 입력)';er.hidden=false;er.classList.add('ok');}
           else{er.classList.remove('ok');er.textContent=(r&&r.msg)||'잠시 후 다시 시도해 주세요.';er.hidden=false;}
         });
         return;
       }
       var v=document.getElementById('code').value.replace(/\D/g,'');
       er.classList.remove('ok');
       if(v.length!==4){er.textContent='인증번호 4자리를 입력해 주세요.';er.hidden=false;return;}
       verify(v);
     });
     function verify(v){
       busy(btn,true,MANUAL?'접수 중…':'확인 중…');
       call({action:'join_verify',src:(new URLSearchParams(location.search).get('from')==='link'?'링크':(OWNER?'QR':'직원폰')),phone:f.phone,code:v,staff:st.staff,store:f.store,type:'',name:'',must:true,opt:false,tasks:'kakao,insta,app'}).then(function(r){
         busy(btn,false);
         if(r&&r.ok){st.coupon=r.coupon||'pending';ev('join_done',{coupon:st.coupon,manual:MANUAL});step3();}
         else{er.classList.remove('ok');er.textContent=(r&&r.msg)||'잠시 후 다시 시도해 주세요.';er.hidden=false;if(!MANUAL&&r&&r.expired){st.sent=false;cw.hidden=true;btn.textContent='인증번호 다시 받기';}}
       });
     }
   });
}

/* 5. 완료 */
function step3(){
  var s=STAFF[st.staff]||['',''];
  var cp=st.coupon==='sent'?['메가MGC커피 아메리카노 쿠폰 2장을 보냈습니다',esc(st.form.phone)+' 문자함을 확인해 주세요. 각 1잔 쿠폰 2장이며, 유효기간은 30일입니다.']
        :(st.coupon==='partial'?['쿠폰 1장을 보냈습니다','문자함을 확인해 주세요. 나머지 1장은 담당 영업사원이 따로 챙겨 드립니다. 쿠폰 유효기간은 30일입니다.']
        :(st.coupon==='limit'?['쿠폰은 담당자가 따로 챙겨 드립니다','오늘 쿠폰 수량이 끝나 담당 영업사원이 직접 보내 드립니다.']
        :['메가MGC커피 아메리카노 쿠폰 2장을 보내 드립니다',esc(st.form.phone)+'로 담당자가 확인한 뒤 영업일 1일 안에 각 1잔 쿠폰 2장을 문자로 보내 드립니다. 유효기간은 30일입니다.']));
  show('<div class="center" style="display:grid;gap:10px;margin-top:12px"><div class="done-ic">'+ICON.check+'</div><h1>가입이 끝났습니다</h1><p class="muted">'+esc(st.form.store)+' 사장님, 반갑습니다.</p></div>'+
   '<div class="gift"><span class="cup">'+ICON.cup+'</span><div><b>'+cp[0]+'</b><span class="muted">'+cp[1]+'</span></div></div>'+
   '<p class="muted center">담당: '+esc(s[0])+' '+esc(s[1])+'</p>'+
   (OWNER?'':'<button class="btn ghost" id="fin" type="button">직원에게 폰 돌려주기</button>'),
   function(){var fb=document.getElementById('fin');if(fb)fb.onclick=function(){resetForm();home();};});
}

document.getElementById('switchBtn').onclick=pickStaff;
load();
var qs=new URLSearchParams(location.search),sv=parseInt(qs.get('s'),10);
if(sv>=1&&sv<=STAFF.length){OWNER=true;st.staff=sv-1;document.getElementById('switchBtn').hidden=true;resetForm();step1();}
else home();
})();
</script>
</body>
</html>
