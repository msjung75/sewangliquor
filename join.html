<title>세왕 거래처 가입</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one-column phone app, a navy staff bar on top and one task card per screen; big thumb-sized buttons at the bottom */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#14213a; --sub:#5d6475; --line:#dcd8cf;
  --gold:#b0873a; --gold-soft:#f4ead6; --ok:#2f7d4f; --ok-soft:#e3f2e8; --warn:#a0471f;
  --bar:#14213a; --bar-fg:#f3f1ec;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141d; --surface:#1a202c; --ink:#eef0f4; --sub:#a3aab8; --line:#2d3546;
  --gold:#d6ab5c; --gold-soft:#3a3020; --ok:#62c18a; --ok-soft:#1d3428; --warn:#e48a62;
  --bar:#0b0f17; --bar-fg:#eef0f4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141d; --surface:#1a202c; --ink:#eef0f4; --sub:#a3aab8; --line:#2d3546;
  --gold:#d6ab5c; --gold-soft:#3a3020; --ok:#62c18a; --ok-soft:#1d3428; --warn:#e48a62;
  --bar:#0b0f17; --bar-fg:#eef0f4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;letter-spacing:.02em;font-size:15px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.75;letter-spacing:0}
.chip-btn{background:transparent;border:1px solid color-mix(in srgb,var(--bar-fg) 35%,transparent);color:var(--bar-fg);
  border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:480px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0}
p{margin:0}
.muted{color:var(--sub);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:14px;padding:18px;font:inherit;cursor:pointer}
.big .ic{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.big b{display:block;font-size:17px}
.big span{color:var(--sub);font-size:14px}
.big.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.big.primary span{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.big.primary .ic{background:var(--gold);color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;background:var(--ink);color:var(--bg);text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#1b1408}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.big:focus-visible,input:focus-visible,.seg button:focus-visible,.staff button:focus-visible,.chip-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600}
input[type=text],input[type=tel]{width:100%;font:inherit;font-size:18px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 40%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 8px;font:inherit;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);font-weight:600}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.agree input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--gold)}
.agree em{font-style:normal;font-weight:700;color:var(--gold)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--gold)}
.gift{border-radius:14px;padding:18px;background:var(--gold-soft);display:flex;gap:14px;align-items:center}
.gift .cup{flex:none;width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--gold)}
.gift b{display:block;font-size:17px}
.code{font-size:34px;letter-spacing:.35em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.demo{font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:8px;padding:8px 10px}
.err{color:var(--warn);font-size:14px}
.qrbox{background:#fff;border-radius:14px;padding:18px;display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:min(70vw,260px)!important;height:auto!important}
.url{font-size:12px;color:var(--sub);word-break:break-all;text-align:center}
.list{display:grid;gap:0}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0}
.row .t{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.pill{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--ok-soft);color:var(--ok);font-weight:600;white-space:nowrap}
.pill.ex{background:var(--line);color:var(--sub)}
.staff{display:grid;gap:8px}
.staff button{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:14px;font:inherit;text-align:left;cursor:pointer}
.staff button span{color:var(--sub);font-size:13px;text-align:right}
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto}
.center{text-align:center}
.testband{background:#a0471f;color:#fff;text-align:center;font-size:14px;font-weight:600;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
.pill.wait{background:var(--gold-soft);color:var(--gold)}
.warnbox{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:10px;padding:10px 12px}
.warnbox b{color:var(--warn)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px}
.btn.kakao{background:#FEE500;color:#191919;font-size:18px;padding:18px}
.btn.ink{background:var(--ink);color:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card.hl{border:2px solid #FEE500;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.card{position:relative}
.no{position:absolute;top:-12px;left:16px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700}
.sns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sns a{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:12px 6px;font-size:14px;color:var(--ink);text-decoration:none;background:var(--surface)}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">세왕상사 · 거래처 가입<small id="who">직원을 선택해 주세요</small></div>
  <button class="chip-btn" id="switchBtn" type="button">직원 변경</button>
</header>
<main id="app"></main>
<script>
(function(){
var API="https://script.google.com/macros/s/AKfycbyJ8-w8S1LK9_lB36t-2oWgBCqki90PIE5ogTNfnQP5ffNTORRqfUyerlpsnYgDlW3B/exec";
var STAFF=[
 ["이한우","부사장","영업 총괄"],["박정언","전무","강남·서초·관악"],["손승일","상무","프랜차이즈"],
 ["이원철","이사","강북·동대문·성동"],["채현용","이사","호텔·와인"],["김환","이사","인천·부천·안산"],
 ["오건훈","이사","송파·강동"],["신홍철","이사","분당·수원·안양"],["배종환","부장","강서·영등포·고양"],
 ["유광석","부장","하남·구리·남양주"],["성현우","부장","용산·마포·은평"],["황현웅","차장","신규 거래처 발굴"],["정민성","대표",""]
];
var JOIN_URL="https://msjung75.github.io/sewangliquor/join.html";
var CHANNEL="https://pf.kakao.com/_ZGIMG/friend";
var APP_IOS="https://apps.apple.com/kr/app/id1462888177";
var APP_AND="https://play.google.com/store/search?q=%EC%84%B8%EC%99%95%EC%83%81%EC%82%AC%20%EC%A3%BC%EB%A5%98%EC%A3%BC%EB%AC%B8&c=apps";
var INSTA="https://www.instagram.com/sewangliquor";
var YOUTUBE="https://youtube.com/@sewangliquor";
var TYPES=["호텔","음식점","주점·바","카페·기타"];
var app=document.getElementById('app');var OWNER=false;
var st={staff:null,form:{store:"",type:"",name:"",phone:"",must:false,warn:false,opt:true},coupon:"pending"};

function ev(n,p){try{gtag('event',n,Object.assign({page:'join',staff:st.staff==null?'':STAFF[st.staff][0]},p||{}));}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem('sw-join')||'{}');if(s.staff!=null)st.staff=s.staff;}catch(e){}}
function save(){try{localStorage.setItem('sw-join',JSON.stringify({staff:st.staff}));}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dash(p){var d=p.replace(/\D/g,'').slice(0,11);if(d.length<4)return d;if(d.length<8)return d.slice(0,3)+'-'+d.slice(3);return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);}
function call(body){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.json();})
    .catch(function(){return {ok:false,msg:'인터넷 연결을 확인하고 다시 시도해 주세요.'};});
}
function busy(btn,on,txt){if(!btn)return;btn.disabled=on;if(on){btn.dataset.t=btn.textContent;btn.textContent=txt||'잠시만요…';}else if(btn.dataset.t){btn.textContent=btn.dataset.t;}}
var OS=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'ios':(/Android/i.test(navigator.userAgent)?'and':'');
var ICON={
 qr:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>',
 phone:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>',
 cup:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 2v3M12 2v3"/></svg>',
 check:'<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 talk:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7L5.8 21l3.9-2.6c.7.1 1.5.2 2.3.2 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></svg>',
 bag:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>'
};

function header(){var w=document.getElementById('who');w.textContent=st.staff==null?'직원을 선택해 주세요':(STAFF[st.staff][0]+' '+STAFF[st.staff][1]+' 담당');}
function show(html,after){app.innerHTML='<div class="screen" style="display:grid;gap:16px">'+html+'</div>';header();window.scrollTo(0,0);if(after)after();}

/* 1. 직원 선택 */
function pickStaff(){
  show('<h1>누구의 폰인가요?</h1><p class="muted">처음 한 번만 고르면 됩니다. 가입한 거래처가 이 이름으로 기록됩니다.</p>'+
   '<div class="staff">'+STAFF.map(function(s,i){return '<button type="button" data-i="'+i+'"><b>'+s[0]+' '+s[1]+'</b><span>'+esc(s[2])+'</span></button>';}).join('')+'</div>',
   function(){app.querySelectorAll('.staff button').forEach(function(b){b.onclick=function(){st.staff=+b.dataset.i;save();ev('join_staff_pick');home();};});});
}

/* 2. 직원 홈 */
function home(){
  if(st.staff==null)return pickStaff();
  show('<div><h1>업주님 가입,<br>1분이면 끝납니다</h1><p class="muted" style="margin-top:6px">인증까지 마치면 업주님 폰으로 아메리카노 쿠폰이 갑니다. 마지막 화면에서 <b style="color:var(--ink)">카카오 채널 추가</b>까지 꼭 같이 눌러 주세요.</p></div>'+
   '<button class="big primary" id="goQR" type="button"><span class="ic">'+ICON.qr+'</span><div><b>업주님 폰으로 가입</b><span>QR을 보여 주면 업주님이 찍어서 가입</span></div></button>'+
   '<button class="big" id="goHere" type="button"><span class="ic">'+ICON.phone+'</span><div><b>이 폰에서 바로 가입</b><span>내 폰을 업주님께 건네서 입력</span></div></button>'+
   '<section class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2>내가 받은 가입</h2><span class="muted" id="cnt">불러오는 중…</span></div><div class="list" id="mine"><div class="row"><div class="t">잠시만요…</div></div></div></section>',
   function(){
     document.getElementById('goQR').onclick=qr;
     document.getElementById('goHere').onclick=function(){resetForm();step1();};
     call({action:'join_stats',staff:st.staff}).then(function(d){
       var c=document.getElementById('cnt'),m=document.getElementById('mine');if(!c)return;
       if(!d||!d.ok){c.textContent='';m.innerHTML='<div class="row"><div class="t">기록을 불러오지 못했습니다.</div></div>';return;}
       c.textContent='오늘 '+d.today+'건 · 전체 '+d.total+'건';
       m.innerHTML=d.recent.length?d.recent.map(function(r){var pill=r.coupon==='발송'?'<span class="pill">쿠폰 발송</span>':'<span class="pill wait">쿠폰 '+esc(r.coupon||'대기')+'</span>';
         return '<div class="row"><div><b>'+esc(r.store)+'</b><div class="t">'+esc(r.type)+' · '+esc(r.phone)+'</div></div><div style="text-align:right">'+pill+'<div class="t">'+esc(r.time)+'</div></div></div>';}).join('')
         :'<div class="row"><div class="t">아직 가입이 없습니다. 첫 업주님을 가입시켜 보세요.</div></div>';
     });
   });
}

/* 3. QR */
function qr(){
  var url=JOIN_URL+'?s='+(st.staff+1);ev('join_qr');
  show('<h1>업주님 폰 카메라로<br>찍어 주세요</h1><div class="qrbox"><div id="qr"></div></div><p class="url">'+esc(url)+'</p>'+
   '<div class="gift"><span class="cup">'+ICON.cup+'</span><div><b>가입하면 아메리카노 1잔</b><span class="muted">업주님 휴대폰 문자로 갑니다</span></div></div>'+
   '<button class="btn ghost" id="back" type="button">처음으로</button>',
   function(){
     try{new QRCode(document.getElementById('qr'),{text:url,width:520,height:520,colorDark:'#14213a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}
     catch(e){document.getElementById('qr').textContent='QR을 그리지 못했습니다. 위 주소를 업주님께 보내 주세요.';}
     document.getElementById('back').onclick=home;});
}

/* 4. 정보 입력 */
function resetForm(){st.form={store:"",type:"",name:"",phone:"",must:false,warn:false,opt:true};}
function step1(){
  var f=st.form;ev('join_form');
  show('<div class="steps"><i class="on"></i><i></i><i></i></div>'+
   '<div><h1>세왕상사 거래처 가입</h1><p class="muted" style="margin-top:6px">가입하시면 <b style="color:var(--ink)">아메리카노 쿠폰</b>을 휴대폰 문자로 보내 드립니다.</p></div>'+
   '<form class="card" id="f1" novalidate>'+
   '<label class="f" for="store">매장 이름<input id="store" type="text" autocomplete="organization" placeholder="예: 세왕 비스트로 성수점" value="'+esc(f.store)+'"></label>'+
   '<div class="f" style="display:grid;gap:6px;font-size:14px;font-weight:600">업종<div class="seg" id="types">'+TYPES.map(function(t){return '<button type="button" aria-pressed="'+(f.type===t)+'">'+t+'</button>';}).join('')+'</div></div>'+
   '<label class="f" for="name">대표자(사장님) 성함<input id="name" type="text" autocomplete="name" placeholder="홍길동" value="'+esc(f.name)+'"></label>'+
   '<label class="f" for="phone">휴대폰 번호 <span class="muted" style="font-weight:400">인증번호와 쿠폰이 이 번호로 갑니다</span><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" value="'+esc(f.phone)+'"></label>'+
   '<label class="agree" for="must"><input id="must" type="checkbox"'+(f.must?' checked':'')+'><span><em>[필수]</em> 거래 안내와 경품 발송을 위해 매장명·성함·휴대폰 번호를 수집·이용하는 데 동의합니다.</span></label>'+
   '<label class="agree warnbox" for="warn"><input id="warn" type="checkbox"'+(f.warn?' checked':'')+'><span><em>[필수]</em> <b>쿠폰은 유효기간 안에 꼭 써 주세요.</b> 기간이 지나면 연장·환불·재발송이 안 됩니다. 확인했습니다.</span></label>'+
   '<label class="agree" for="opt"><input id="opt" type="checkbox"'+(f.opt?' checked':'')+'><span><em style="color:var(--sub)">[선택]</em> 주간 시장동향 리포트와 신상품·행사 소식을 카카오톡·문자로 받겠습니다.</span></label>'+
   '<p class="err" id="e1" hidden></p>'+
   '<button class="btn" type="submit" id="sendBtn">인증번호 받기</button></form>'+
   (OWNER?'':'<button class="btn ghost" id="cancel" type="button">직원 화면으로</button>'),
   function(){
     var ph=document.getElementById('phone');
     ph.addEventListener('input',function(){ph.value=dash(ph.value);});
     app.querySelectorAll('#types button').forEach(function(b){b.onclick=function(){f.type=b.textContent;app.querySelectorAll('#types button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});};});
     var cb=document.getElementById('cancel');if(cb)cb.onclick=home;
     document.getElementById('f1').addEventListener('submit',function(e){
       e.preventDefault();
       f.store=document.getElementById('store').value.trim();f.name=document.getElementById('name').value.trim();
       f.phone=dash(ph.value);f.must=document.getElementById('must').checked;f.warn=document.getElementById('warn').checked;f.opt=document.getElementById('opt').checked;
       var er=document.getElementById('e1'),msg='';
       if(!f.store)msg='매장 이름을 입력해 주세요.';
       else if(!f.type)msg='업종을 골라 주세요.';
       else if(!f.name)msg='성함을 입력해 주세요.';
       else if(!/^01[016789]-\d{3,4}-\d{4}$/.test(f.phone))msg='휴대폰 번호를 다시 확인해 주세요. (예: 010-1234-5678)';
       else if(!f.must||!f.warn)msg='[필수] 두 항목에 체크해 주셔야 쿠폰을 보내 드릴 수 있습니다.';
       if(msg){er.textContent=msg;er.hidden=false;return;}
       var btn=document.getElementById('sendBtn');busy(btn,true,'인증번호 보내는 중…');
       call({action:'join_send',phone:f.phone,staff:st.staff,store:f.store}).then(function(d){
         busy(btn,false);
         if(d&&d.ok){ev('join_sms_sent');step2();}
         else{er.textContent=(d&&d.msg)||'잠시 후 다시 시도해 주세요.';er.hidden=false;}
       });
     });
   });
}

/* 5. 인증번호 */
function step2(){
  show('<div class="steps"><i class="on"></i><i class="on"></i><i></i></div>'+
   '<div><h1>문자로 온 4자리를<br>입력해 주세요</h1><p class="muted" style="margin-top:6px">'+esc(st.form.phone)+'로 인증번호를 보냈습니다. 5분 안에 입력해 주세요.</p></div>'+
   '<form class="card" id="f2" novalidate>'+
   '<label class="f" for="code">인증번호<input id="code" class="code" type="tel" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="····"></label>'+
   '<p class="err" id="e2" hidden></p><button class="btn gold" type="submit" id="okBtn">확인하고 쿠폰 받기</button></form>'+
   '<button class="btn ghost" id="back2" type="button">번호 다시 입력 · 다시 받기</button>',
   function(){
     var c=document.getElementById('code');c.focus();
     document.getElementById('back2').onclick=step1;
     document.getElementById('f2').addEventListener('submit',function(e){
       e.preventDefault();var er=document.getElementById('e2');var v=c.value.replace(/\D/g,'');
       if(v.length!==4){er.textContent='4자리를 입력해 주세요.';er.hidden=false;return;}
       var btn=document.getElementById('okBtn');busy(btn,true,'확인 중…');
       var f=st.form;
       call({action:'join_verify',phone:f.phone,code:v,staff:st.staff,store:f.store,type:f.type,name:f.name,must:f.must&&f.warn,opt:f.opt}).then(function(d){
         busy(btn,false);
         if(d&&d.ok){st.coupon=d.coupon||'pending';ev('join_done',{coupon:st.coupon});step3();}
         else{er.textContent=(d&&d.msg)||'잠시 후 다시 시도해 주세요.';er.hidden=false;if(d&&d.expired)setTimeout(step1,1600);}
       });
     });
   });
}

/* 6. 완료 — 카카오 채널 → 주문 앱 → 인스타·유튜브 */
function step3(){
  var s=STAFF[st.staff]||['',''];
  var cp=st.coupon==='sent'?['아메리카노 쿠폰을 보냈습니다',esc(st.form.phone)+' 문자함을 확인해 주세요. 유효기간 안에 꼭 써 주세요.']
        :(st.coupon==='limit'?['쿠폰은 담당자가 따로 챙겨 드립니다','오늘 쿠폰 수량이 끝나 담당 영업사원이 직접 보내 드립니다.']
        :['아메리카노 쿠폰은 오늘 안에 갑니다',esc(st.form.phone)+'로 문자 쿠폰을 보내 드립니다. 유효기간 안에 꼭 써 주세요.']);
  var appBtns=OS==='ios'?'<a class="btn ink" id="appBtn" href="'+APP_IOS+'" target="_blank" rel="noopener">'+ICON.bag+' 「세왕상사 주류주문」 앱 받기</a>'
    :OS==='and'?'<a class="btn ink" id="appBtn" href="'+APP_AND+'" target="_blank" rel="noopener">'+ICON.bag+' 「세왕상사 주류주문」 앱 받기</a>'
    :'<div class="two"><a class="btn ink" href="'+APP_IOS+'" target="_blank" rel="noopener">아이폰</a><a class="btn ink" href="'+APP_AND+'" target="_blank" rel="noopener">안드로이드</a></div>';
  show('<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div>'+
   '<div class="center" style="display:grid;gap:10px"><div class="done-ic">'+ICON.check+'</div><h1>가입이 끝났습니다</h1><p class="muted">'+esc(st.form.store)+' · '+esc(st.form.name)+' 사장님, 반갑습니다.</p></div>'+
   '<div class="gift"><span class="cup">'+ICON.cup+'</span><div><b>'+cp[0]+'</b><span class="muted">'+cp[1]+'</span></div></div>'+
   '<section class="card hl"><div class="no">1</div><h2>카카오톡으로 리포트 받기</h2><p class="muted">매주 수요일, 매장 운영에 쓸 외식·주류 시장 소식이 카톡으로 옵니다. 채널 추가 한 번이면 끝.</p>'+
   '<a class="btn kakao" id="chBtn" href="'+CHANNEL+'" target="_blank" rel="noopener">'+ICON.talk+' 카카오 채널 추가하기</a></section>'+
   '<section class="card"><div class="no">2</div><h2>앱으로 바로 주문하기</h2><p class="muted">스토어에서 「세왕상사 주류주문」을 받아 두시면 전화 없이 주문할 수 있습니다.</p>'+appBtns+'</section>'+
   '<div class="sns"><a href="'+INSTA+'" target="_blank" rel="noopener" id="igBtn">인스타그램 @sewangliquor</a><a href="'+YOUTUBE+'" target="_blank" rel="noopener" id="ytBtn">유튜브 @sewangliquor</a></div>'+
   '<p class="muted center">담당: '+esc(s[0])+' '+esc(s[1])+'</p>'+
   (OWNER?'':'<button class="btn ghost" id="fin" type="button">직원에게 폰 돌려주기</button>'),
   function(){
     var fb=document.getElementById('fin');if(fb)fb.onclick=function(){resetForm();home();};
     [['chBtn','join_kakao'],['appBtn','join_app'],['igBtn','join_insta'],['ytBtn','join_youtube']].forEach(function(x){var b=document.getElementById(x[0]);if(b)b.addEventListener('click',function(){ev(x[1]);});});
   });
}

document.getElementById('switchBtn').onclick=pickStaff;
load();
var qs=new URLSearchParams(location.search),sv=parseInt(qs.get('s'),10);
if(sv>=1&&sv<=STAFF.length){OWNER=true;st.staff=sv-1;document.getElementById('switchBtn').hidden=true;resetForm();step1();}
else home();
})();
</script>
</body>
</html>
