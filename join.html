<style>
/* Layout: one-column phone app, a navy staff bar on top and one task card per screen; big thumb-sized buttons at the bottom */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#14213a; --sub:#5d6475; --line:#dcd8cf;
  --gold:#b0873a; --gold-soft:#f4ead6; --ok:#2f7d4f; --ok-soft:#e3f2e8; --warn:#a0471f;
  --bar:#14213a; --bar-fg:#f3f1ec;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141d; --surface:#1a202c; --ink:#eef0f4; --sub:#a3aab8; --line:#2d3546;
  --gold:#d6ab5c; --gold-soft:#3a3020; --ok:#62c18a; --ok-soft:#1d3428; --warn:#e48a62;
  --bar:#0b0f17; --bar-fg:#eef0f4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141d; --surface:#1a202c; --ink:#eef0f4; --sub:#a3aab8; --line:#2d3546;
  --gold:#d6ab5c; --gold-soft:#3a3020; --ok:#62c18a; --ok-soft:#1d3428; --warn:#e48a62;
  --bar:#0b0f17; --bar-fg:#eef0f4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;letter-spacing:.02em;font-size:15px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.75;letter-spacing:0}
.chip-btn{background:transparent;border:1px solid color-mix(in srgb,var(--bar-fg) 35%,transparent);color:var(--bar-fg);
  border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:480px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0}
p{margin:0}
.muted{color:var(--sub);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:14px;padding:18px;font:inherit;cursor:pointer}
.big .ic{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.big b{display:block;font-size:17px}
.big span{color:var(--sub);font-size:14px}
.big.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.big.primary span{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.big.primary .ic{background:var(--gold);color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;background:var(--ink);color:var(--bg);text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#1b1408}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.big:focus-visible,input:focus-visible,.seg button:focus-visible,.staff button:focus-visible,.chip-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600}
input[type=text],input[type=tel]{width:100%;font:inherit;font-size:18px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 40%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 8px;font:inherit;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);font-weight:600}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.agree input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--gold)}
.agree em{font-style:normal;font-weight:700;color:var(--gold)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--gold)}
.gift{border-radius:14px;padding:18px;background:var(--gold-soft);display:flex;gap:14px;align-items:center}
.gift .cup{flex:none;width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--gold)}
.gift b{display:block;font-size:17px}
.code{font-size:34px;letter-spacing:.35em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.demo{font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:8px;padding:8px 10px}
.err{color:var(--warn);font-size:14px}
.qrbox{background:#fff;border-radius:14px;padding:18px;display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:min(70vw,260px)!important;height:auto!important}
.url{font-size:12px;color:var(--sub);word-break:break-all;text-align:center}
.list{display:grid;gap:0}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0}
.row .t{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.pill{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--ok-soft);color:var(--ok);font-weight:600;white-space:nowrap}
.pill.ex{background:var(--line);color:var(--sub)}
.staff{display:grid;gap:8px}
.staff button{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:14px;font:inherit;text-align:left;cursor:pointer}
.staff button span{color:var(--sub);font-size:13px;text-align:right}
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto}
.center{text-align:center}
.testband{background:#a0471f;color:#fff;text-align:center;font-size:14px;font-weight:600;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<style>
.pill.wait{background:var(--gold-soft);color:var(--gold)}
.warnbox{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:10px;padding:10px 12px}
.warnbox b{color:var(--warn)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px}
.btn.kakao{background:#FEE500;color:#191919;font-size:18px;padding:18px}
.btn.ink{background:var(--ink);color:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card.hl{border:2px solid #FEE500;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.card{position:relative}
.no{position:absolute;top:-12px;left:16px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700}
.sns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sns a{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:12px 6px;font-size:14px;color:var(--ink);text-decoration:none;background:var(--surface)}
</style>

<style>
.hero{position:relative;overflow:hidden;background:var(--bar);color:var(--bar-fg);border-radius:20px;padding:22px 20px 20px}
.hero-k{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--gold);background:rgba(255,255,255,.08);border-radius:999px;padding:4px 10px}
.hero h1{color:var(--bar-fg);font-size:28px;line-height:1.25;margin:10px 0 6px}
.hero p{margin:0;font-size:15px;opacity:.8}
.hero-cup{position:absolute;right:-6px;top:10px;opacity:.16;transform:scale(3.4);transform-origin:top right;color:var(--gold)}
.pg{display:flex;align-items:center;gap:10px;margin-top:16px}
.pg-bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.pg-bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .35s}
.pg b{font-size:15px;min-width:42px;text-align:right}
.tasks{display:grid;gap:10px}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;transition:border-color .2s,background .2s}
.task .ti{position:relative;flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.task .ti.kakao{background:#FEE500;color:#191919}
.task .ti.insta{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);color:#fff}
.task .ti.ink{background:var(--ink);color:var(--bg)}
.task .tk{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--sub)}
.task.on{border-color:var(--ok);background:var(--ok-soft)}
.task.on .tk{background:var(--ok);border-color:var(--ok);color:#fff}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:16px}
.task .tx span{display:block;font-size:13px;color:var(--sub);line-height:1.4;margin-top:2px}
.task .tb{display:flex;flex-direction:column;gap:6px;flex:none}
.tbtn{display:block;text-align:center;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.tbtn.kakao{background:#FEE500;color:#191919}
.tbtn.insta{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);color:#fff}
.tbtn.ink{background:var(--ink);color:var(--bg)}
.task.on .tbtn{background:transparent;color:var(--ok);border:1.5px solid var(--ok);padding:8.5px 12.5px}
.cpn{border:2px solid var(--gold);transition:opacity .2s}
.cpn-h{display:flex;gap:12px;align-items:center;color:var(--gold)}
.cpn-h .lk{flex:none;width:44px;height:44px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;font-size:20px}
.cpn-h b{display:block;font-size:18px;color:var(--ink)}
.cpn-body{display:grid;gap:12px;margin-top:14px}
.cpn.lock{border:1.5px dashed var(--line);opacity:.75}
.cpn.lock .cpn-body{display:none}
.err.ok{color:var(--ok)}
.svy{border:2px solid var(--ink)}.svy h2{margin:0;font-size:18px}.svy .q{margin-top:14px}.svy .q>b{display:block;font-size:15px;margin-bottom:8px}
.svy .ops{display:flex;flex-wrap:wrap;gap:6px}.svy .ops label{position:relative}.svy .ops input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.svy .ops span{display:block;border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px;background:var(--surface)}
.svy .ops input:checked+span{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:600}
.svy .ops input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.svy textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;background:var(--surface);color:var(--ink)}
.svy-k{display:inline-block;font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:3px 9px;margin-bottom:6px}
.rpt{display:grid;gap:10px}.rpt h2{margin:0}.rpt ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}.rpt .two a{text-align:center}
.kind{display:grid;gap:10px}
.join-otp{display:grid;gap:10px}.join-otp .code{font-size:28px;letter-spacing:.22em}.join-otp-time{font-size:13px;font-variant-numeric:tabular-nums;color:var(--sub)}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">세왕상사 · 거래처 가입<small id="who">직원을 선택해 주세요</small></div>
  <button class="chip-btn" id="switchBtn" type="button">직원 변경</button>
</header>
<main id="app"></main>
<script>
(function(){
/* join-otp-20261117: verify the current number before registration; coupon handling remains server-controlled. */
var joinScreenCleanup=null,joinOtpCooldowns={},joinReceipts={};
var API="https://script.google.com/macros/s/AKfycbyJ8-w8S1LK9_lB36t-2oWgBCqki90PIE5ogTNfnQP5ffNTORRqfUyerlpsnYgDlW3B/exec";
var STAFF=[
 ["이한우","부사장","영업 총괄"],["박정언","전무","강남·서초·관악"],["손승일","상무","프랜차이즈"],
 ["이원철","이사","강북·동대문·성동"],["채현용","이사","호텔·와인"],["김환","이사","인천·부천·안산"],
 ["오건훈","이사","송파·강동"],["신홍철","이사","분당·수원·안양"],["배종환","부장","강서·영등포·고양"],
 ["유광석","부장","하남·구리·남양주"],["성현우","부장","용산·마포·은평"],["황현웅","차장","신규 거래처 발굴"],["정민성","대표",""]
];
var JOIN_URL="https://msjung75.github.io/sewangliquor/join.html";
var CHANNEL="https://pf.kakao.com/_ZGIMG/friend";
var APP_IOS="https://apps.apple.com/kr/app/id1462888177";
var APP_AND="https://play.google.com/store/search?q=%EC%84%B8%EC%99%95%EC%83%81%EC%82%AC%20%EC%A3%BC%EB%A5%98%EC%A3%BC%EB%AC%B8&c=apps";
var INSTA="https://www.instagram.com/sewangliquor";
var YOUTUBE="https://youtube.com/@sewangliquor";
var TYPES=["호텔","음식점","주점·바","카페·기타"];
var app=document.getElementById('app');var OWNER=false;
var st={staff:null,form:{},done:{},coupon:"pending"};

function ev(n,p){try{gtag('event',n,Object.assign({page:'join',staff:st.staff==null?'':STAFF[st.staff][0]},p||{}));}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem('sw-join')||'{}');if(s.staff!=null)st.staff=s.staff;}catch(e){}}
function save(){try{localStorage.setItem('sw-join',JSON.stringify({staff:st.staff}));}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dash(p){var d=p.replace(/\D/g,'').slice(0,11);if(d.length<4)return d;if(d.length<8)return d.slice(0,3)+'-'+d.slice(3);return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);}
function call(body){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.json();})
    .catch(function(){return {ok:false,msg:'인터넷 연결을 확인하고 다시 시도해 주세요.'};});
}
function busy(btn,on,txt){if(!btn)return;btn.disabled=on;if(on){btn.dataset.t=btn.textContent;btn.textContent=txt||'잠시만요…';}else if(btn.dataset.t){btn.textContent=btn.dataset.t;}}
var OS=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'ios':(/Android/i.test(navigator.userAgent)?'and':'');
var ICON={
 qr:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>',
 phone:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>',
 cup:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 2v3M12 2v3"/></svg>',
 check:'<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 talk:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7L5.8 21l3.9-2.6c.7.1 1.5.2 2.3.2 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></svg>',
 bag:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>'
};

function header(){var w=document.getElementById('who');w.textContent=st.staff==null?'직원을 선택해 주세요':(OWNER?'담당 ':'')+STAFF[st.staff][0]+' '+STAFF[st.staff][1]+(OWNER?'':' 담당');}
function show(html,after){if(joinScreenCleanup){var dispose=joinScreenCleanup;joinScreenCleanup=null;dispose();}app.innerHTML='<div class="screen" style="display:grid;gap:16px">'+html+'</div>';header();window.scrollTo(0,0);if(after)after();}

/* 1. 직원 선택 */
function pickStaff(){
  show('<h1>누구의 폰인가요?</h1><p class="muted">처음 한 번만 고르면 됩니다. 가입한 거래처가 이 이름으로 기록됩니다.</p>'+
   '<div class="staff">'+STAFF.map(function(s,i){return '<button type="button" data-i="'+i+'"><b>'+s[0]+' '+s[1]+'</b><span>'+esc(s[2])+'</span></button>';}).join('')+'</div>',
   function(){app.querySelectorAll('.staff button').forEach(function(b){b.onclick=function(){st.staff=+b.dataset.i;save();ev('join_staff_pick');home();};});});
}

/* 2. 직원 홈 */
function home(){
  if(st.staff==null)return pickStaff();

function setupJoinOtp(f){
  var form=document.getElementById('f1'),er=document.getElementById('e1'),btn=document.getElementById('goBtn');
  var ph=document.getElementById('phone'),store=document.getElementById('store'),must=document.getElementById('must');
  var send=document.getElementById('sendOtp'),verify=document.getElementById('verifyOtp'),cw=document.getElementById('codeWrap'),code=document.getElementById('code'),status=document.getElementById('otpStatus'),time=document.getElementById('otpTime');
  var disposed=false,revision=0,sequence=0,sending=false,verifying=false,submitting=false;
  var proof='',proofUntil=0,verifiedPhone='',challengePhone='',challengeUntil=0,lastPhone=number(),sentOnce=false;
  function number(){return ph.value.replace(/\D/g,'').slice(0,11);}
  function validPhone(){return /^01[016789]\d{7,8}$/.test(number());}
  function error(message){er.textContent=message;er.hidden=!message;er.classList.remove('ok');}
  function clearAuth(){proof='';proofUntil=0;verifiedPhone='';challengePhone='';challengeUntil=0;code.value='';cw.hidden=true;}
  function invalidate(){revision++;sequence++;sending=false;verifying=false;clearAuth();status.textContent='휴대폰 번호를 다시 인증해 주세요.';error('');render();}
  function lifetime(r){if(!r||r.expiresIn===undefined)return 300000;var n=Number(r.expiresIn);return isFinite(n)&&n>=0?Math.min(n,300)*1000:0;}
  function waitFor(r){var n=Number(r&&r.retryAfter);return isFinite(n)&&n>0?Math.min(n,3600)*1000:60000;}
  function allowed(){return allDone()&&surveyOk()&&!!store.value.trim()&&validPhone()&&must.checked;}
  function verified(){return !!proof&&verifiedPhone===number()&&Date.now()<proofUntil;}
  function cooldown(){return Math.max(0,Math.ceil(((joinOtpCooldowns[number()]||0)-Date.now())/1000));}
  function render(){
    if(disposed)return;
    if((proof&&Date.now()>=proofUntil)||(challengePhone&&Date.now()>=challengeUntil)){
      revision++;sequence++;sending=false;verifying=false;clearAuth();status.textContent='인증 시간이 지났습니다. 인증번호를 다시 받아 주세요.';
    }
    var wait=cooldown(),authed=verified(),busy=sending||verifying||submitting;
    send.disabled=busy||!allowed()||wait>0||authed;send.textContent=sending?'인증번호 요청 중…':(wait>0?'인증번호 다시 받기 ('+wait+'초)':(sentOnce?'인증번호 다시 받기':'인증번호 받기'));
    verify.disabled=busy||!allowed()||cw.hidden||!/^\d{6}$/.test(code.value)||Date.now()>=challengeUntil;
    verify.textContent=verifying?'인증번호 확인 중…':'인증번호 확인';
    btn.disabled=busy||!allowed()||!authed;btn.textContent=submitting?(isEx()?'보내는 중…':'가입 접수 중…'):(isEx()?'의견 보내고 쿠폰 받기':'가입하고 쿠폰 신청');
    ph.readOnly=submitting;store.readOnly=submitting;must.disabled=submitting;code.disabled=busy||authed;
    var until=authed?proofUntil:challengeUntil;
    time.textContent=until>Date.now()?(authed?'인증 유지 시간 ':'인증번호 입력 시간 ')+Math.floor(Math.ceil((until-Date.now())/1000)/60)+':'+('0'+Math.ceil((until-Date.now())/1000)%60).slice(-2):'';
  }
  function collect(){f.store=store.value.trim();f.phone=dash(ph.value);f.must=must.checked;return {store:f.store,phone:f.phone,must:f.must,opt:false};}
  function validate(){collect();var msg=!allDone()?'위 3개(카카오·인스타·앱)를 먼저 눌러 주세요.':!surveyOk()?'위 설문 4문항을 골라 주세요.':(!f.store?'매장 이름을 입력해 주세요.':(!validPhone()?'휴대폰 번호를 다시 확인해 주세요.':(!must.checked?'[필수] 항목에 체크해 주세요.':'')));error(msg);return !msg;}
  function post(body){
    return new Promise(function(resolve){var settled=false;var timer=setTimeout(function(){finish(null);},20000);function finish(r){if(settled)return;settled=true;clearTimeout(timer);resolve(r);}try{fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}).then(function(r){if(r.ok===false)throw Error('response');return r.json();}).then(finish,function(){finish(null);});}catch(e){finish(null);}});
  }
  function current(rev,seq,phone){return !disposed&&revision===rev&&sequence===seq&&number()===phone&&must.checked;}
  function otpError(r,stage){
    if(r&&r.dup){var receipt={state:'duplicate',form:collect(),staff:st.staff};joinReceipts[number()]=receipt;showJoinReceipt(receipt);return;}
    if(r&&r.retryAfter)joinOtpCooldowns[number()]=Math.max(joinOtpCooldowns[number()]||0,Date.now()+waitFor(r));
    if(r&&(r.expired||r.otpRequired)){clearAuth();status.textContent='인증 시간이 지났습니다. 인증번호를 다시 받아 주세요.';error('인증번호를 다시 받아 인증해 주세요.');}
    else if(r&&r.invalidCode)error('인증번호가 맞지 않습니다. 문자에 적힌 6자리를 확인해 주세요.');
    else if(r&&r.phoneLimit)error('인증 요청이 많습니다. 잠시 후 다시 시도해 주세요.');
    else if(r&&r.dailyLimit)error('오늘 인증 요청이 마감되었습니다. 담당 영업사원에게 문의해 주세요.');
    else if(r&&r.rateLimited)error('잠시 기다린 뒤 인증번호를 다시 요청해 주세요.');
    else if(r&&r.surveyFull)error('이번 설문은 마감되었습니다. 담당 영업사원에게 말씀해 주세요.');
    else if(r&&r.bad)error(r.survey?'설문 4문항을 골라 주세요.':'휴대폰 번호와 필수 항목을 다시 확인해 주세요.');
    else error(stage==='verify'?'인증번호를 확인하지 못했습니다. 잠시 후 다시 확인해 주세요.':'지금은 인증문자를 보낼 수 없습니다. 잠시 후 다시 시도해 주세요.');
  }
  send.onclick=function(){
    if(disposed||sending||verifying||submitting||!validate())return;render();if(cooldown()>0||verified())return;
    var receipt=joinReceipts[number()];if(receipt){showJoinReceipt(receipt);return;}
    var phone=number(),rev=revision,seq=++sequence;sending=true;clearAuth();error('');joinOtpCooldowns[phone]=Date.now()+60000;render();
    post({action:'join_send_otp',phone:phone,agree:true}).then(function(r){
      if(!current(rev,seq,phone))return;sending=false;sentOnce=true;
      if(!r||(r.ok&&(r.otpSent||r.pending))){
        joinOtpCooldowns[phone]=Date.now()+waitFor(r);var ttl=lifetime(r);challengePhone=phone;challengeUntil=Date.now()+ttl;
        cw.hidden=ttl<=0;status.textContent=ttl<=0?'인증 시간이 지났습니다. 인증번호를 다시 받아 주세요.':(r&&r.otpSent?'인증번호를 보냈습니다. 5분 안에 입력해 주세요.':'인증문자 발송 결과를 확인 중입니다. 문자가 도착하면 인증번호를 입력해 주세요. 재요청은 대기 시간이 지난 뒤 가능합니다.');
        if(ttl>0)code.focus();
      }else otpError(r,'send');render();
    });
  };
  verify.onclick=function(){
    if(disposed||sending||verifying||submitting||!validate())return;render();if(cw.hidden||!/^\d{6}$/.test(code.value)||challengePhone!==number()||Date.now()>=challengeUntil){error('문자로 온 인증번호 6자리를 입력해 주세요.');return;}
    var phone=number(),rev=revision,seq=++sequence;verifying=true;error('');render();
    post({action:'join_verify_otp',phone:phone,code:code.value}).then(function(r){
      if(!current(rev,seq,phone))return;verifying=false;
      if(r&&r.ok&&typeof r.proof==='string'&&r.proof){var ttl=lifetime(r);if(ttl>0){proof=r.proof;proofUntil=Date.now()+ttl;verifiedPhone=phone;challengePhone='';challengeUntil=0;code.value='';cw.hidden=true;status.textContent='휴대폰 번호 인증이 완료되었습니다. 아래 버튼을 눌러 가입을 신청해 주세요.';btn.focus();}else{clearAuth();status.textContent='인증 시간이 지났습니다. 인증번호를 다시 받아 주세요.';}}
      else otpError(r,'verify');render();
    });
  };
  form.addEventListener('submit',function(e){
    e.preventDefault();if(disposed||submitting||sending||verifying||!validate())return;render();
    var phone=number(),existing=joinReceipts[phone];if(existing){showJoinReceipt(existing);return;}
    if(!verified()){error('휴대폰 번호를 먼저 인증해 주세요.');return;}
    var submittedProof=proof,snapshot=collect(),receipt={state:'checking',form:Object.assign({},snapshot),staff:st.staff};joinReceipts[phone]=receipt;
    var rev=revision,seq=++sequence;submitting=true;clearAuth();error('');render();
    var payload={action:'join_submit',phone:snapshot.phone,proof:submittedProof,staff:st.staff,store:snapshot.store,type:'',name:'',must:true,opt:false,tasks:isEx()?'':'kakao,insta,app',kind:st.kind,survey:isEx()?{q1:st.sv.q1||'',q2:st.sv.q2||'',q3:st.sv.q3||'',q4:st.sv.q4||'',q5:(st.sv.q5||'').slice(0,200)}:null,src:isEx()?'survey':(new URLSearchParams(location.search).get('from')==='link'?'링크':(OWNER?'QR':'직원폰'))};submittedProof='';
    post(payload).then(function(r){
      if(r&&r.ok&&r.verified===true){receipt.state='done';receipt.coupon=r.coupon||'pending';receipt.mode=r.mode==='api'||r.api===true?'api':'mail';receipt.accepted=Number.isInteger(r.accepted)&&r.accepted>=0&&r.accepted<=2?r.accepted:0;receipt.delivered=r.delivered===2?2:0;ev('join_done',{coupon:receipt.coupon,mode:receipt.mode});}
      else if(r&&r.dup)receipt.state='duplicate';
      else if(r&&(r.surveyFull||r.otpRequired||r.expired||r.invalidCode||r.bad||r.need||r.configuration||r.dailyLimit||r.budget||r.rateLimited)){
        delete joinReceipts[phone];if(!current(rev,seq,phone))return;submitting=false;clearAuth();otpError(r,'verify');render();return;
      }
      if(!disposed&&revision===rev&&sequence===seq&&number()===phone)showJoinReceipt(receipt);
    });
  });
  ph.addEventListener('input',function(){var next=number();ph.value=dash(ph.value);f.phone=ph.value;if(next!==lastPhone){lastPhone=next;invalidate();}else render();});
  store.addEventListener('input',function(){f.store=store.value.trim();render();});
  must.addEventListener('change',function(){f.must=must.checked;if(!must.checked)invalidate();else render();});
  code.addEventListener('input',function(){code.value=code.value.replace(/\D/g,'').slice(0,6);error('');render();});
  var cancel=document.getElementById('cancel');if(cancel)cancel.onclick=home;
  var timer=setInterval(render,1000);joinScreenCleanup=function(){disposed=true;revision++;sequence++;clearAuth();clearInterval(timer);};
  var existing=joinReceipts[number()];if(existing){showJoinReceipt(existing);return function(){};}
  render();return render;
}

     task('insta','2','인스타그램 팔로우','신상품·행사 소식 @sewangliquor',[[INSTA,'팔로우']],'insta')+
     task('app','3','주문 앱 받기','세왕상사 주류주문 · 전화 없이 주문',appLinks,'ink')+
   '</section>'+
   '<form class="card cpn'+(allDone()?'':' lock')+'" id="f1" novalidate>'+
     '<div class="cpn-h"><span class="lk">'+(allDone()?ICON.cup:'🔒')+'</span><div><b>아메리카노 쿠폰 2장 받기</b><span class="muted" id="lockMsg">'+(allDone()?'번호를 인증한 뒤 쿠폰을 신청해 주세요':'위 3개를 마치면 열려요')+'</span></div></div>'+
     '<div class="cpn-body">'+
     '<label class="f" for="store">매장 이름<input id="store" type="text" autocomplete="organization" placeholder="예: 세왕 비스트로 성수점" value="'+esc(f.store)+'"></label>'+
     '<label class="f" for="phone">휴대폰 번호<input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" value="'+esc(f.phone)+'"></label>'+
     '<label class="agree warnbox" for="must"><input id="must" type="checkbox"'+(f.must?' checked':'')+'><span><em>[필수]</em> 가입·문자인증·쿠폰 발송을 위해 매장명·휴대폰 번호 수집 및 이용에 동의하며, <b>쿠폰 유효기간은 30일이며, 유효기간이 지나면 연장·환불·재발송이 안 되는 것</b>을 확인했습니다.</span></label>'+
     '<button class="btn ghost" type="button" id="sendOtp" aria-controls="codeWrap">인증번호 받기</button>'+
     '<div class="join-otp" id="codeWrap" hidden><label class="f" for="code">문자로 온 인증번호 6자리<input id="code" class="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" aria-describedby="otpStatus otpTime" placeholder="000000"></label><button class="btn ghost" type="button" id="verifyOtp">인증번호 확인</button></div>'+
     '<p class="muted" id="otpStatus" role="status" aria-live="polite">휴대폰 번호를 인증하면 가입을 신청할 수 있습니다.</p><p class="join-otp-time" id="otpTime" aria-live="off"></p>'+
     '<p class="err" id="e1" role="alert" hidden></p>'+
     '<button class="btn gold" type="submit" id="goBtn" disabled>가입하고 쿠폰 신청</button>'+
   '</div></form>'+
   (OWNER?'':'<button class="btn ghost" id="cancel" type="button">직원 화면으로</button>'),
   function(){
     var form=document.getElementById('f1'),otpRefresh=function(){};
     function refresh(){
       app.querySelectorAll('.task').forEach(function(t){var k=t.dataset.k;t.classList.toggle('on',d[k]);t.querySelector('.tk').textContent=d[k]?'✓':({kakao:'1',insta:'2',app:'3'})[k];});

       document.getElementById('lockMsg').textContent=allDone()?'번호를 인증한 뒤 쿠폰을 신청해 주세요':'위 3개를 마치면 열려요';
       form.querySelector('.lk').innerHTML=allDone()?ICON.cup:'🔒';
       if(was&&allDone()){setTimeout(function(){form.scrollIntoView({behavior:'smooth',block:'start'});},350);}
       otpRefresh();
     }
     app.querySelectorAll('.tbtn').forEach(function(a){a.addEventListener('click',function(){d[a.dataset.k]=true;ev('join_task',{task:a.dataset.k});setTimeout(refresh,300);});});
     otpRefresh=setupJoinOtp(f);

   });
}

   '<p class="muted center">담당: '+esc(s[0])+' '+esc(s[1])+'</p>'+
   (OWNER?'':'<button class="btn ghost" id="fin" type="button">직원에게 폰 돌려주기</button>'),
   function(){var fb=document.getElementById('fin');if(fb)fb.onclick=function(){resetForm();home();};});
}

load();
